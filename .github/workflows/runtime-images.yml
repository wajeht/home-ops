name: Patched runtime images

on:
  push:
    branches: [main]
    paths:
      - "apps/*/Dockerfile"
      - ".github/workflows/runtime-images.yml"
  pull_request:
    paths:
      - "apps/*/Dockerfile"
      - ".github/workflows/runtime-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Runtime (${{ matrix.app }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        app: [homepage, zigbee2mqtt, dbgate, umami, renovate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER}/home-ops-${{ matrix.app }}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build patched image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=runtime-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.app }}
      - name: Verify security runtime and Brotli round trip
        run: |
          docker run --rm --network none --entrypoint node "$IMAGE" -e '
            const assert = require("node:assert/strict");
            const zlib = require("node:zlib");
            const minimum = {22: [23, 4], 24: [22, 1], 26: [12, 1]};
            const [major, minor, patch] = process.versions.node.split(".").map(Number);
            const required = minimum[major];
            assert(required && (minor > required[0] || (minor === required[0] && patch >= required[1])));
            const input = Buffer.from("runtime security smoke test");
            assert.deepEqual(zlib.brotliDecompressSync(zlib.brotliCompressSync(input)), input);
            console.log(process.version);
          '
      - name: Verify both Renovate runtimes and PHP
        if: matrix.app == 'renovate'
        run: |
          docker run --rm --network none --entrypoint /usr/local/renovate/node "$IMAGE" -e 'if (process.versions.node !== "24.22.1") process.exit(1)'
          docker run --rm --network none --entrypoint php "$IMAGE" -r 'if (PHP_VERSION !== "8.5.12") exit(1); echo PHP_VERSION, PHP_EOL;'
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: github.event_name != 'pull_request'
        run: docker push "$IMAGE"
