name: Secrets Rotation Reminder

on:
  schedule:
    - cron: "0 9 1 * *" # 09:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      force_all:
        description: "Include all cadences regardless of month (for testing)"
        type: boolean
        default: false

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { default: run } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/secrets-rotation.mjs`)
            await run({ github, context, core })
