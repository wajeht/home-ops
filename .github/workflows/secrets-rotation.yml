name: Secrets Rotation Reminder

on:
  schedule:
    - cron: "0 9 1 * *" # 09:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      force_all:
        description: "Include all cadences regardless of month (for testing)"
        type: boolean
        default: false

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: run } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/secrets-rotation.mjs`)
            await run({ github, context, core })
