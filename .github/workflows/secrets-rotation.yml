name: Secrets Rotation Reminder

on:
  schedule:
    - cron: "0 9 1 * *" # 09:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      force_all:
        description: "Include all cadences regardless of month (for testing)"
        type: boolean
        default: false

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('.github/secrets-rotation.json', 'utf8'));

            const now = new Date();
            const month = now.getUTCMonth() + 1; // 1-12
            const year = now.getUTCFullYear();
            const quarter = Math.floor((month - 1) / 3) + 1;
            const force = context.payload.inputs && context.payload.inputs.force_all === 'true';

            // Which cadences are due this month? Quarterly: Jan/Apr/Jul/Oct. Semiannual: Jan/Jul. Annual: Jan.
            const due = [];
            if (force || [1, 4, 7, 10].includes(month)) due.push('quarterly');
            if (force || [1, 7].includes(month)) due.push('semiannual');
            if (force || month === 1) due.push('annual');
            if (due.length === 0) {
              core.info(`Nothing due in month ${month}. Exiting.`);
              return;
            }

            const title = `🔐 Secret rotation — ${year} Q${quarter}`;

            // Idempotency: skip if an open issue with this title already exists.
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            if (existing.some((i) => i.title === title)) {
              core.info(`Issue "${title}" already open. Skipping.`);
              return;
            }

            const headings = { quarterly: 'Quarterly', semiannual: 'Semi-annual', annual: 'Annual (review)' };
            let body = `Rotate the secrets below, then update the encrypted \`apps/<app>/.env.sops\` and push. `;
            body += `The repo is **public** — SOPS is the only thing protecting these values.\n\n`;
            body += `Rotation policy and how-to: [docs/security.md → Secret Rotation](../blob/main/docs/security.md#secret-rotation).\n`;
            for (const cadence of due) {
              body += `\n## ${headings[cadence]}\n\n`;
              for (const s of manifest[cadence]) {
                body += `- [ ] **${s.id}** — ${s.what}  \n  ↳ ${s.where}\n`;
              }
            }

            // Ensure labels exist, then create the issue.
            for (const [name, color] of [['security', 'd93f0b'], ['rotation', 'fbca04']]) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name });
              } catch {
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name, color });
              }
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['security', 'rotation'],
            });
            core.info(`Opened ${issue.data.html_url}`);
