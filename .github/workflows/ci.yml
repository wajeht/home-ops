name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 25
      - name: Install tools
        run: |
          command -v shellcheck &>/dev/null || sudo apt-get install -y shellcheck
          command -v shfmt &>/dev/null || sudo apt-get install -y shfmt
      - name: Check formatting
        run: |
          npx oxfmt@0.57.0 --check "**/*.{yml,yaml,md,json,js}"
          find scripts apps -name '*.sh' -print0 | xargs -0 shfmt -d -i 0 -ci
      - name: Lint
        run: ./scripts/lint.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Scan for plaintext secrets
        run: |
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --redact --verbose --exit-code 1

  sync:
    if: github.event_name == 'push'
    needs: [lint, secrets]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Trigger docker-cd sync
        env:
          DOCKER_CD_URL: ${{ secrets.DOCKER_CD_URL }}
          DOCKER_CD_API_SECRET: ${{ secrets.DOCKER_CD_API_SECRET }}
        run: node .github/scripts/sync.js
