name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 25
      - name: Install tools
        run: |
          command -v shellcheck &>/dev/null || sudo apt-get install -y shellcheck
          command -v shfmt &>/dev/null || sudo apt-get install -y shfmt
      - name: Check formatting
        run: |
          npx oxfmt@0.57.0 --check "**/*.{yml,yaml,md,json,js,mjs}"
          find scripts apps -name '*.sh' -print0 | xargs -0 shfmt -d -i 0 -ci
      - name: Lint
        run: ./scripts/lint.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan for plaintext secrets
        run: |
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --redact --verbose --exit-code 1

  algorithm-visualizer:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect image changes
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
            apps/algo/Dockerfile \
            apps/algo/frontend.patch \
            apps/algo/server.patch; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GHCR
        if: steps.changes.outputs.changed == 'true' && github.event_name == 'push'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        if: steps.changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build image
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: apps/algo
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/wajeht/algorithm-visualizer:18de2edf-v1
          labels: org.opencontainers.image.source=https://github.com/wajeht/home-ops
          cache-from: type=gha,scope=algorithm-visualizer
          cache-to: type=gha,mode=max,scope=algorithm-visualizer

  sync:
    if: github.event_name == 'push'
    needs: [lint, secrets, algorithm-visualizer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trigger docker-cd sync
        env:
          DOCKER_CD_URL: ${{ secrets.DOCKER_CD_URL }}
          DOCKER_CD_API_SECRET: ${{ secrets.DOCKER_CD_API_SECRET }}
        run: node .github/scripts/sync.mjs
