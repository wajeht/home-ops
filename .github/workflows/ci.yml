name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 25
      - name: Install tools
        run: |
          command -v shellcheck &>/dev/null || sudo apt-get install -y shellcheck
          command -v shfmt &>/dev/null || sudo apt-get install -y shfmt
      - name: Check formatting
        run: |
          npx oxfmt --check "**/*.{yml,yaml,md,json}" '!apps/adguard/**'
          shfmt -d -i 0 -ci scripts/*.sh
      - name: Lint
        run: ./scripts/lint.sh

  sync:
    if: github.event_name == 'push'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Trigger docker-cd sync
        run: |
          RESPONSE=$(curl -sS --max-time 10 -X POST \
            -H "Authorization: Bearer ${{ secrets.DOCKER_CD_API_SECRET }}" \
            "${{ secrets.DOCKER_CD_URL }}/api/sync" 2>&1) || true
          echo "$RESPONSE" | jq . 2>/dev/null || echo "Response: $RESPONSE"
