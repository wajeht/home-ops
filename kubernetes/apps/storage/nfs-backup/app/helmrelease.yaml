---
# Dynamic NFS PV provisioner pointing at the Synology /volume1/backup share.
# Subdirectories land under /volume1/backup/k8s/<namespace>-<pvc-name>-<pvc-uid>/
# so docker-cd's existing backups in /volume1/backup/<app>/ remain untouched.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-backup
  namespace: storage
spec:
  interval: 1h
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: 4.0.18
      sourceRef:
        kind: HelmRepository
        name: nfs-subdir-external-provisioner
        namespace: storage
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: nfs-backup
    replicaCount: 1
    nfs:
      server: 192.168.4.243
      path: /volume1/backup
      mountOptions:
        - nfsvers=4.1
        - hard
        - noatime
    storageClass:
      create: true
      defaultClass: false # Longhorn is the default; this is opt-in
      name: nfs-backup
      provisionerName: cluster.local/nfs-backup
      reclaimPolicy: Retain # NEVER auto-delete backup data on PVC delete
      archiveOnDelete: true # If PVC is deleted, rename instead of remove
      pathPattern: k8s/${.PVC.namespace}-${.PVC.name}-${.PVC.uid}
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
