---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/helm-controller/main/docs/api/v2/helm.toolkit.fluxcd.io_helmreleases.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: prometheus
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 84.5.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # ── Talos-specific disables ──────────────────────────────────────────────
    # Talos binds these control-plane components to 127.0.0.1, so the chart's
    # default ServiceMonitors cannot scrape them. Disable to avoid noisy
    # `*Down` alerts. Cilium replaces kube-proxy entirely.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false # Talos etcd is also bound locally; revisit later if needed

    defaultRules:
      disabled:
        # Silence rules that fire because their scrape targets are disabled above
        KubeControllerManagerDown: true
        KubeSchedulerDown: true
        KubeProxyDown: true
        # Optional — node-exporter's RAID rule complains on single-disk nodes
        NodeRAIDDegraded: true

    # ── Prometheus ───────────────────────────────────────────────────────────
    prometheus:
      prometheusSpec:
        retention: 14d
        # Pick up ServiceMonitors / PodMonitors / PrometheusRules across the
        # whole cluster (homelab convention — only one Prometheus anyway).
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 20Gi
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 2Gi

    # ── Alertmanager ─────────────────────────────────────────────────────────
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 2Gi
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi

    # ── Grafana ──────────────────────────────────────────────────────────────
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        type: pvc
        storageClassName: longhorn
        size: 5Gi
      # Access via `kubectl port-forward -n prometheus svc/kube-prometheus-stack-grafana 3000:80`
      # until oauth2-proxy is in front (then uncomment httproute.yaml in app/kustomization.yaml).
      # Dashboards live as ConfigMaps with the `grafana_dashboard` label thanks to
      # sidecar.dashboards.enabled below — manage dashboards as code, not via the UI,
      # so the Grafana PVC stays disposable and we don't need to back it up.
      sidecar:
        dashboards:
          enabled: true
        datasources:
          enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi
