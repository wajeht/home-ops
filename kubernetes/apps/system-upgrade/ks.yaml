---
# Upstream Rancher SUC manifests (CRDs + controller + RBAC).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: system-upgrade-controller
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/rancher/system-upgrade-controller
  ref:
    tag: v0.19.2
  ignore: |
    /*
    !/manifests
    !/crd
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-upgrade-controller
  namespace: flux-system
spec:
  targetNamespace: system-upgrade
  interval: 30m
  path: ./manifests
  prune: true
  sourceRef:
    kind: GitRepository
    name: system-upgrade-controller
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-upgrade-plans
  namespace: flux-system
spec:
  targetNamespace: system-upgrade
  interval: 30m
  path: ./kubernetes/apps/system-upgrade/plans
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: system-upgrade-controller # CRDs must exist before Plans apply
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 5m
