---
apiVersion: v1
kind: Namespace
metadata:
  name: node-feature-discovery
  labels:
    # NFD worker reads host info via hostPath (/sys, /etc/os-release, /proc/swaps, etc.),
    # which violates the default `baseline` PodSecurity profile. Allow privileged here.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
