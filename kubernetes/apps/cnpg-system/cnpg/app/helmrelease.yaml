---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.28.2
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: cnpg-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: cnpg
    crds:
      create: true
    replicaCount: 1
    priorityClassName: system-cluster-critical
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    # Webhook config — operator validates Cluster CRs at admission time.
    webhook:
      port: 9443
    # Disable monitoring until kube-prometheus-stack lands; otherwise it
    # tries to create a PodMonitor against a CRD that doesn't exist yet.
    monitoring:
      podMonitorEnabled: false
      grafanaDashboard:
        create: false
