---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internet
  namespace: kube-system
spec:
  gatewayClassName: cilium
  # Gateway gets a LoadBalancer Service with an IP from CiliumLoadBalancerIPPool "lan-pool".
  # Cloudflared reaches it via cluster DNS (cilium-gateway-internet.kube-system.svc),
  # so the LB IP itself doesn't need to be externally routable.
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
