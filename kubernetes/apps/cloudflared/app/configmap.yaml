---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: network
  annotations:
    # cloudflared restarts on config change (reloader watches this annotation)
    reloader.stakater.com/match: "true"
data:
  config.yml: |
    tunnel: d85a81e9-2e65-4660-b929-5305d58b94e9
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    # Wildcard catch-all: every *.wajeht.com is funneled to the cluster Gateway,
    # which then routes by Host header via HTTPRoutes. Paired with a single
    # wildcard CNAME (*.wajeht.com → tunnel) so adding a new app needs no DNS
    # changes and no edits here — just create an HTTPRoute on the Gateway.
    ingress:
      - service: http://cilium-gateway-internet.kube-system.svc.cluster.local:80
