---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nfs-backup
  namespace: flux-system
spec:
  targetNamespace: storage
  interval: 30m
  path: ./kubernetes/apps/nfs-backup/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
