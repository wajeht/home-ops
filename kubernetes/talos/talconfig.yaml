---
clusterName: home-cluster
talosVersion: v1.12.6
kubernetesVersion: v1.35.2
endpoint: https://192.168.4.162:6443
allowSchedulingOnControlPlanes: true

# Cilium owns CNI + kube-proxy replacement + LB IPAM + Gateway API.
# Talos must NOT install Flannel.
cniConfig:
  name: none

nodes:
  - hostname: soapwa
    ipAddress: 192.168.4.162
    controlPlane: true
    installDisk: /dev/sdb

  - hostname: yanlon
    ipAddress: 192.168.4.163
    controlPlane: false
    installDisk: /dev/nvme0n1
    # Mount the 1TB SATA SanDisk at /var/mnt/longhorn for Longhorn storage.
    # Talos auto-mounts UserVolumes at /var/mnt/<name>.
    patches:
      - |-
        apiVersion: v1alpha1
        kind: UserVolumeConfig
        name: longhorn
        provisioning:
          diskSelector:
            match: disk.transport == "sata"
          minSize: 100GB
        filesystem:
          type: xfs

  # - hostname: apollo
  #   ipAddress: 192.168.4.161
  #   controlPlane: false
  #   installDisk: /dev/nvme0n1

patches:
  - |-
    machine:
      install:
        wipe: true
  # Disable kube-proxy — Cilium replaces it
  - |-
    cluster:
      proxy:
        disabled: true

controlPlane:
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/i915
          - siderolabs/intel-ucode
          - siderolabs/iscsi-tools
          - siderolabs/util-linux-tools
          # - siderolabs/nut-client  # disabled: needs ExtensionServiceConfig (NUT server on Synology) — without it, Talos boot times out at ~70min and reboots in a loop. Re-enable after wiring up the Synology UPS service + ExtensionServiceConfig.

worker:
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/i915
          - siderolabs/intel-ucode
          - siderolabs/iscsi-tools
          - siderolabs/util-linux-tools
          # - siderolabs/nut-client  # disabled: needs ExtensionServiceConfig (NUT server on Synology) — without it, Talos boot times out at ~70min and reboots in a loop. Re-enable after wiring up the Synology UPS service + ExtensionServiceConfig.
