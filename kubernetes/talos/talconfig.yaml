---
clusterName: home-cluster
talosVersion: v1.12.6
kubernetesVersion: v1.35.2
endpoint: https://192.168.4.162:6443
allowSchedulingOnControlPlanes: true

# Cilium owns CNI + kube-proxy replacement + LB IPAM + Gateway API.
# Talos must NOT install Flannel.
cniConfig:
  name: none

nodes:
  - hostname: soapwa
    ipAddress: 192.168.4.162
    controlPlane: true
    installDisk: /dev/sdb

  - hostname: yanlon
    ipAddress: 192.168.4.163
    controlPlane: false
    installDisk: /dev/nvme0n1

  # - hostname: apollo
  #   ipAddress: 192.168.4.161
  #   controlPlane: false
  #   installDisk: /dev/nvme0n1

patches:
  - |-
    machine:
      install:
        wipe: true
  # Disable kube-proxy — Cilium replaces it
  - |-
    cluster:
      proxy:
        disabled: true

controlPlane:
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/i915
          - siderolabs/intel-ucode
          - siderolabs/iscsi-tools
          - siderolabs/util-linux-tools
          - siderolabs/nut-client

worker:
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/i915
          - siderolabs/intel-ucode
          - siderolabs/iscsi-tools
          - siderolabs/util-linux-tools
          - siderolabs/nut-client
