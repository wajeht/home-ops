x-docker-cd:
  rolling_update: true

services:
  bang:
    image: ghcr.io/wajeht/bang:1b17baf@sha256:bc237f5db1562cd8d66d3655b7a96f6bcf7e2f7fbcd2e74d2ae1bdb7cab8d632
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/bang:/usr/src/app/dist/src/db/sqlite
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bang.rule=Host(`bang.jaw.dev`)"
      - "traefik.http.routers.bang.entrypoints=websecure"
      - "traefik.http.routers.bang.middlewares=rate-limit-global@file"
      - "traefik.http.services.bang.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
