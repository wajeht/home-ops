x-docker-cd:
  rolling_update: false

services:
  mirror-sync:
    container_name: gitea-mirror-sync
    image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache curl jq bash
        while true; do
          echo "=== Mirror sync started at $$(date) ==="
          /scripts/mirror-sync.sh || echo "Sync failed"
          echo "=== Sleeping 1h ==="
          sleep 3600
        done
    environment:
      - GITEA_URL=http://gitea:3000
      - GITHUB_USER=wajeht
    env_file:
      - .env
    volumes:
      - ./mirror-sync.sh:/scripts/mirror-sync.sh:ro
    networks:
      - gitea-internal
    restart: unless-stopped
    init: true
    # lint-ignore: healthcheck  # bash worker loop, no port — process liveness is restart-on-exit
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gitea:
    container_name: gitea
    image: gitea/gitea:1.27@sha256:34e3f6b75f5cbb6aebce588037fc5a53c84213e4d4b00da0a8d73e031a558e52
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__ROOT_URL=https://gitea.jaw.dev/
      - GITEA__server__DOMAIN=gitea.jaw.dev
      - GITEA__mirror__ENABLED=true
      - GITEA__mirror__DEFAULT_INTERVAL=1h
      - GITEA__service__DISABLE_REGISTRATION=true
    env_file:
      - .env
    volumes:
      - /home/jaw/data/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - traefik
      - gitea-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitea.rule=Host(`gitea.jaw.dev`)"
      - "traefik.http.routers.gitea.entrypoints=websecure"
      - "traefik.http.routers.gitea.middlewares=oauth2-admin@file"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"

networks:
  traefik:
    external: true
  gitea-internal:
