x-docker-cd:
  rolling_update: false

services:
  oauth2-admin:
    container_name: oauth2-admin
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561
    command:
      - --http-address=0.0.0.0:4180
      - --provider=google
      - --client-id=${OAUTH2_PROXY_CLIENT_ID}
      - --client-secret=${OAUTH2_PROXY_CLIENT_SECRET}
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}
      - --cookie-domain=.jaw.dev
      - --cookie-expire=24h
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --reverse-proxy=true
      - --trusted-proxy-ip=172.16.0.0/12
      - --upstream=static://202
      - --set-xauthrequest=true
      - --skip-provider-button=true
      - --whitelist-domain=.jaw.dev
      - --silence-ping-logging=true
      - --cookie-name=_oauth2_admin
      - --proxy-prefix=/oauth2/admin
      - --redirect-url=https://auth.jaw.dev/oauth2/admin/callback
      - --authenticated-emails-file=/etc/oauth2-proxy/admin-emails.txt
    configs:
      - source: oauth2_admin_emails
        target: /etc/oauth2-proxy/admin-emails.txt
    volumes:
      - ./portcheck:/portcheck:ro
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    networks:
      - traefik
    restart: unless-stopped
    init: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/portcheck", "--port", "4180"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oauth2-admin.rule=Host(`auth.jaw.dev`) && PathPrefix(`/oauth2/admin`)"
      - "traefik.http.routers.oauth2-admin.entrypoints=websecure"
      - "traefik.http.routers.oauth2-admin.priority=100"
      - "traefik.http.services.oauth2-admin.loadbalancer.server.port=4180"

  oauth2-media:
    container_name: oauth2-media
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561
    command:
      - --http-address=0.0.0.0:4180
      - --provider=google
      - --client-id=${OAUTH2_PROXY_CLIENT_ID}
      - --client-secret=${OAUTH2_PROXY_CLIENT_SECRET}
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}
      - --cookie-domain=.jaw.dev
      - --cookie-expire=168h
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --reverse-proxy=true
      - --trusted-proxy-ip=172.16.0.0/12
      - --upstream=static://202
      - --set-xauthrequest=true
      - --skip-provider-button=true
      - --whitelist-domain=.jaw.dev
      - --silence-ping-logging=true
      - --cookie-name=_oauth2_media
      - --proxy-prefix=/oauth2/media
      - --redirect-url=https://auth.jaw.dev/oauth2/media/callback
      - --authenticated-emails-file=/etc/oauth2-proxy/media-emails.txt
    configs:
      - source: oauth2_media_emails
        target: /etc/oauth2-proxy/media-emails.txt
    volumes:
      - ./portcheck:/portcheck:ro
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    networks:
      - traefik
    restart: unless-stopped
    init: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/portcheck", "--port", "4180"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oauth2-media.rule=Host(`auth.jaw.dev`) && PathPrefix(`/oauth2/media`)"
      - "traefik.http.routers.oauth2-media.entrypoints=websecure"
      - "traefik.http.routers.oauth2-media.priority=100"
      - "traefik.http.services.oauth2-media.loadbalancer.server.port=4180"

networks:
  traefik:
    external: true

configs:
  oauth2_admin_emails:
    content: |
      ${OAUTH2_ADMIN_EMAIL_1}
  oauth2_media_emails:
    content: |
      ${OAUTH2_MEDIA_EMAIL_1}
      ${OAUTH2_MEDIA_EMAIL_2}
      ${OAUTH2_MEDIA_EMAIL_3}
      ${OAUTH2_MEDIA_EMAIL_4}
      ${OAUTH2_MEDIA_EMAIL_5}
      ${OAUTH2_MEDIA_EMAIL_6}
