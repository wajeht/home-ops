x-docker-cd:
  rolling_update: false
services:
  bang:
    image: ghcr.io/wajeht/bang:05b322e
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    volumes:
      - bang:/usr/src/app/dist/src/db/sqlite
    networks:
      - traefik
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - http://localhost:80/healthz
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.http.routers.bang-pr-373.rule=Host(`pr-373-bang.jaw.dev`)
      - traefik.http.routers.bang-pr-373.entrypoints=websecure
      - traefik.http.routers.bang-pr-373.middlewares=oauth2-admin@file
      - traefik.http.services.bang-pr-373.loadbalancer.server.port=80
networks:
  traefik:
    external: true
volumes:
  bang: null
