# force
services:
  vikunja:
    container_name: vikunja
    image: vikunja/vikunja:2.3.0@sha256:f6b80393c1998cd5cd0dc38d24762c59ab4c10000a6f1032ef5b554e262cab93
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
      - VIKUNJA_SERVICE_PUBLICURL=https://todo.jaw.dev/
      - VIKUNJA_DATABASE_TYPE=sqlite
      - VIKUNJA_DATABASE_PATH=/db/vikunja.db
      - VIKUNJA_SERVICE_ENABLEREGISTRATION=false
    volumes:
      - /home/jaw/data/vikunja/db:/db
      - /home/jaw/data/vikunja/files:/app/vikunja/files
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3456/api/v1/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vikunja.rule=Host(`todo.jaw.dev`)"
      - "traefik.http.routers.vikunja.entrypoints=websecure"
      - "traefik.http.routers.vikunja.middlewares=google-auth@file"
      - "traefik.http.services.vikunja.loadbalancer.server.port=3456"

networks:
  traefik:
    external: true
