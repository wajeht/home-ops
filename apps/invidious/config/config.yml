db:
  user: invidious
  host: invidious-db
  port: 5432
  dbname: invidious

check_tables: true

domain: invidious.jaw.dev
https_only: true
external_port: 443

# Private instance — registration disabled, login still allowed so prefs persist.
registration_enabled: false
login_enabled: true
captcha_enabled: false

# Privacy: do not publish instance stats or expose a public popular feed.
statistics_enabled: false
popular_enabled: false

# Playback flows (signature decryption, DASH manifests, PO-tokens) are delegated
# to invidious-companion. The shared secret is supplied via the env var
# INVIDIOUS_INVIDIOUS_COMPANION_KEY (which also goes to the companion as
# SERVER_SECRET_KEY). Without companion, playback breaks within days.
invidious_companion:
  - private_url: "http://invidious-companion:8282/companion"

default_user_preferences:
  default_home: Subscriptions
  feed_menu: [Subscriptions, Trending]
  quality: hd720
  quality_dash: best
  player_style: invidious
  dark_mode: dark
  comments: [youtube, ""]
