services:
  invidious:
    container_name: invidious
    image: quay.io/invidious/invidious:2026.05.21-99390d0@sha256:c01db291ca784bdc94a2563b7de91b2d3bd9b49bd9aa9a912162917a5bf105f1
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    volumes:
      - ./config/config.yml:/invidious/config/config.yml:ro
      - ./portcheck:/portcheck:ro
    depends_on:
      invidious-db:
        condition: service_healthy
      invidious-companion:
        condition: service_started
    networks:
      - traefik
      - invidious-internal
    # portcheck avoids the BusyBox-wget IPv6 issue (localhost→::1 but app binds 0.0.0.0).
    healthcheck:
      test: ["CMD", "/portcheck", "--port", "3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.invidious.rule=Host(`invidious.jaw.dev`)"
      - "traefik.http.routers.invidious.entrypoints=websecure"
      - "traefik.http.routers.invidious.middlewares=oauth2-admin@file"
      - "traefik.http.services.invidious.loadbalancer.server.port=3000"

  # Deno sidecar that handles YouTube signature decryption + DASH/PO-token flows.
  # Replaced the older inv-sig-helper in late 2024 — required for playback to keep working.
  invidious-companion:
    container_name: invidious-companion
    image: quay.io/invidious/invidious-companion:master-e1ab452@sha256:314ebe3e2ff8569557b5a619123e2c69e66275a05e368a096dac4f5d5240eadc
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/invidious/companion-cache:/var/tmp/youtubei.js
      - ./portcheck:/portcheck:ro
    networks:
      - invidious-internal
    # Companion image is distroless — no /bin/sh, no wget. portcheck is a static binary.
    healthcheck:
      test: ["CMD", "/portcheck", "--port", "8282"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  invidious-db:
    container_name: invidious-db
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    env_file:
      - .env
    environment:
      - POSTGRES_USER=invidious
      - POSTGRES_DB=invidious
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - /home/jaw/data/invidious/db:/var/lib/postgresql/data
    networks:
      - invidious-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invidious"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    shm_size: 128m
    oom_score_adj: -300
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik:
    external: true
  invidious-internal:
