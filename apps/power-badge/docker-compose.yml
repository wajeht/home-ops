x-docker-cd:
  rolling_update: false

services:
  power-badge:
    image: ghcr.io/wajeht/power-badge:051c15e@sha256:e24cc493c24718a5bbb2bca5190e6ab02d4f4982a2e4a02b2df5da9474018bca
    container_name: power-badge
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.power-badge.rule=Host(`power-badge.jaw.dev`)"
      - "traefik.http.routers.power-badge.entrypoints=websecure"
      - "traefik.http.routers.power-badge.middlewares=rate-limit-global@file"
      - "traefik.http.services.power-badge.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 32M

networks:
  traefik:
    external: true
