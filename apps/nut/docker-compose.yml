services:
  nut:
    container_name: nut
    image: instantlinux/nut-upsd:2.8.3-r3@sha256:a3de216f044ba9ddd2181a04fe3e5299c91063e8c2dbd0577f82bca5717061f7
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
      - NAME=ups
      - DRIVER=usbhid-ups
      - PORT=auto
      - VENDORID=0764
      - PRODUCTID=0601
      - MAXAGE=25
      - DESCRIPTION=CyberPower PR1500LCDRT2U
      - ACTIONS=SET,FSD
      - INSTCMDS=ALL
    ports:
      - "3493:3493"
    devices:
      - /dev/bus/usb:/dev/bus/usb
    networks:
      - nut-internal
    healthcheck:
      test: ["CMD", "/usr/bin/upsc", "ups@localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  peanut:
    container_name: peanut
    image: brandawg93/peanut:5.22.0@sha256:14d71889539a5b050961ca69f20b3c9fd5fa5af439e388dff08ebbe32bf15c84
    environment:
      - TZ=America/Chicago
      - NUT_HOST=nut
      - NUT_PORT=3493
      - WEB_PORT=8080
    depends_on:
      nut:
        condition: service_healthy
    networks:
      - traefik
      - nut-internal
    healthcheck:
      test: ["CMD", "/portcheck", "--port", "8080"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    volumes:
      - /home/jaw/data/nut:/config
      - ./portcheck:/portcheck:ro
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.peanut.rule=Host(`nut.jaw.dev`)"
      - "traefik.http.routers.peanut.entrypoints=websecure"
      - "traefik.http.routers.peanut.middlewares=google-auth@file"
      - "traefik.http.services.peanut.loadbalancer.server.port=8080"

  nut-borgmatic:
    container_name: nut-borgmatic
    image: ghcr.io/borgmatic-collective/borgmatic:2.1.5@sha256:f6b0a640d72bf7bb628479246e7c919404917cc58ddc6cdfb8d2d40d786d3a26
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/nut:/source/data
      - /home/jaw/backup/nut:/repository
      - /home/jaw/data/nut/borgmatic:/borgmatic/state
      - ./borgmatic-config.yml:/etc/borgmatic/config.yaml:ro
      - ./borgmatic-crontab.txt:/etc/borgmatic.d/crontab.txt:ro
    networks:
      - backup
    healthcheck:
      test: ["CMD-SHELL", "borgmatic --version"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik:
    external: true
  backup:
    external: true
  nut-internal:
