services:
  close-powerlifting:
    image: ghcr.io/wajeht/close-powerlifting:b07a7d8
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    networks:
      - traefik
    healthcheck:
      test:
        - CMD
        - curl
        - "-fsS"
        - http://localhost:80/healthz
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.http.routers.close-powerlifting-pr-295.rule=Host(`pr-295-close-powerlifting.jaw.dev`) || Host(`pr-295-close-powerlifting.jaw.dev`)
      - traefik.http.routers.close-powerlifting-pr-295.entrypoints=websecure
      - traefik.http.routers.close-powerlifting-pr-295.middlewares=rate-limit-global@file
      - traefik.http.services.close-powerlifting-pr-295.loadbalancer.server.port=80
networks:
  traefik:
    external: true
  backup:
    external: true
