services:
  # lint-ignore: backup  # stateless — last-known-IP cache, auto-rebuilds on startup
  ddns-updater:
    container_name: ddns-updater
    image: ghcr.io/qdm12/ddns-updater:v2.9.1@sha256:3758e33ca466190a580d08acc6bffb59c1b22526b9e27b76815f541fc7acc932
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
      - PERIOD=5m
      - UPDATE_COOLDOWN_PERIOD=5m
      - HTTP_TIMEOUT=10s
      - PUBLICIP_FETCHERS=all
      - PUBLICIP_DNS_PROVIDERS=all
      - PUBLICIP_HTTP_PROVIDERS=all
      - BACKUP_PERIOD=24h
      - LOG_LEVEL=info
      - SHOUTRRR_ADDRESSES=ntfy://ntfy:80/ddns-updater?scheme=http
    volumes:
      - /home/jaw/data/ddns-updater:/updater/data
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "/updater/ddns-updater", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ddns-updater.rule=Host(`ddns.jaw.dev`)"
      - "traefik.http.routers.ddns-updater.entrypoints=websecure"
      - "traefik.http.routers.ddns-updater.middlewares=oauth2-admin@file"
      - "traefik.http.services.ddns-updater.loadbalancer.server.port=8000"
networks:
  traefik:
    external: true
