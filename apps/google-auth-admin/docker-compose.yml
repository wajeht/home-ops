# force
services:
  google-auth-admin:
    container_name: google-auth-admin
    # Upstream did not publish a semver tag for the build that supports
    # rule.*.whitelist. Keep this digest-only pin; 2/2.2.0 reject it.
    image: thomseddon/traefik-forward-auth@sha256:b364aa6a4117569163eff793999901f9f5a0c4f7f2da18b4ecbcd140d7b6107b
    command:
      - --rule.bypass.action=allow
      - --rule.bypass.rule=HeadersRegexp(`X-Bypass-Key`, `^${X_BYPASS_KEY}$$`)
      # Media-facing apps allow the wider media user list. Everything else falls
      # back to WHITELIST_ADMINS below.
      - --rule.plex.action=auth
      - --rule.plex.rule=Host(`plex.jaw.dev`)
      - --rule.plex.whitelist=${WHITELIST_MEDIA}
      - --rule.seerr.action=auth
      - --rule.seerr.rule=Host(`seerr.jaw.dev`)
      - --rule.seerr.whitelist=${WHITELIST_MEDIA}
      - --rule.convertx.action=auth
      - --rule.convertx.rule=Host(`convertx.jaw.dev`)
      - --rule.convertx.whitelist=${WHITELIST_MEDIA}
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
      - DEFAULT_PROVIDER=google
      - AUTH_HOST=auth.jaw.dev
      - COOKIE_DOMAIN=jaw.dev
      - INSECURE_COOKIE=true
      - LOG_LEVEL=info
      - WHITELIST=${WHITELIST_ADMINS}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./portcheck:/portcheck:ro
    healthcheck:
      test: ["CMD", "/portcheck", "--port", "4181"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - traefik
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    oom_score_adj: -500
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.google-auth-admin.rule=Host(`auth.jaw.dev`)"
      - "traefik.http.routers.google-auth-admin.entrypoints=websecure"
      - "traefik.http.routers.google-auth-admin.middlewares=google-auth-admin@file"
      - "traefik.http.services.google-auth-admin.loadbalancer.server.port=4181"

networks:
  traefik:
    external: true
