x-docker-cd:
  rolling_update: true

services:
  favicon:
    image: ghcr.io/wajeht/favicon:aa2cb6d@sha256:efcce2c6e46e81e061835f922a98187a40b0462d5d8c0e09685a4d2670582a68
    environment:
      TZ: America/Chicago
    volumes:
      - /home/jaw/data/favicon:/app/data
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.favicon.rule=Host(`favicon.jaw.dev`)"
      - "traefik.http.routers.favicon.entrypoints=websecure"
      - "traefik.http.routers.favicon.middlewares=rate-limit-global@file"
      - "traefik.http.services.favicon.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
