source_directories:
  - /source/data

exclude_patterns:
  - "*/borgmatic"

repositories:
  - path: /repository
    label: zigbee2mqtt

archive_name_format: "zigbee2mqtt-{now:%Y-%m-%d-%H%M%S}"
compression: zstd,3

keep_daily: 7
keep_weekly: 4
keep_monthly: 6

checks:
  - name: repository
    frequency: 1 week
  - name: archives
    frequency: 1 week

check_last: 3

ntfy:
  topic: borgmatic
  server: http://ntfy:80
  finish:
    title: "zigbee2mqtt backup complete"
    message: "zigbee2mqtt backup finished"
    priority: min
    tags: white_check_mark
  fail:
    title: "zigbee2mqtt backup FAILED"
    message: "zigbee2mqtt backup failed"
    priority: max
    tags: skull
  states:
    - finish
    - fail
