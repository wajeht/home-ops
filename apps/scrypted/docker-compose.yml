services:
  scrypted:
    container_name: scrypted
    image: ghcr.io/koush/scrypted:v0.143.0-noble-full@sha256:f23251dad07cf02b4b6b2e364e7948ab9fb77656e31f226186c2ba5304ebd2cd
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/scrypted/volume:/server/volume
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "993"
      - "44"
    ports:
      - "127.0.0.1:10443:10443" # HTTPS UI (localhost only, Traefik handles external)
    networks:
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --insecure https://localhost:10443 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.scrypted.rule=Host(`scrypted.jaw.dev`)"
      - "traefik.http.routers.scrypted.entrypoints=websecure"
      - "traefik.http.routers.scrypted.middlewares=google-auth@file"
      - "traefik.http.services.scrypted.loadbalancer.server.port=10443"
      - "traefik.http.services.scrypted.loadbalancer.server.scheme=https"
      - "traefik.http.services.scrypted.loadbalancer.serversTransport=scrypted-transport@file"

networks:
  traefik:
    external: true
