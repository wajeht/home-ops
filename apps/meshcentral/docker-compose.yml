services:
  meshcentral:
    container_name: meshcentral
    image: ghcr.io/ylianst/meshcentral:latest@sha256:b2ed98974f85a04d78698ae441931e98d3d536ef5561f5b4e93e2985c1173734
    environment:
      - HOSTNAME=meshcentral.jaw.dev
      - REVERSE_PROXY=traefik
      - REVERSE_PROXY_TLS_PORT=443
      - ALLOW_NEW_ACCOUNTS=false
      - WEBRTC=true
      - IFRAME=false
      - REDIR_PORT=0
    volumes:
      - /home/jaw/data/meshcentral/data:/opt/meshcentral/meshcentral-data
      - /home/jaw/data/meshcentral/files:/opt/meshcentral/meshcentral-files
      - /home/jaw/data/meshcentral/backups:/opt/meshcentral/meshcentral-backups
    networks:
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "curl -sfk https://localhost:443 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.meshcentral.rule=Host(`meshcentral.jaw.dev`)"
      - "traefik.http.routers.meshcentral.entrypoints=websecure"
      - "traefik.http.routers.meshcentral.middlewares=google-auth@file"
      - "traefik.http.services.meshcentral.loadbalancer.server.port=443"
      - "traefik.http.services.meshcentral.loadbalancer.server.scheme=https"
networks:
  traefik:
    external: true
