x-docker-cd:
  rolling_update: true

services:
  notify:
    image: ghcr.io/wajeht/notify:ac9a3f1@sha256:0d48a7969239554a6ddf29aa9b99f394f80b55667fd2a52bdad1d1c17419e676
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/notify:/usr/src/app/dist/src/db/sqlite
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notify.rule=Host(`notify.jaw.dev`)"
      - "traefik.http.routers.notify.entrypoints=websecure"
      - "traefik.http.routers.notify.middlewares=rate-limit-global@file"
      - "traefik.http.services.notify.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
