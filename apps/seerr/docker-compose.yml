services:
  seerr:
    container_name: seerr
    image: seerr/seerr:v3.1.0@sha256:b35ba0461c4a1033d117ac1e5968fd4cbe777899e4cbfbdeaf3d10a42a0eb7e9
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/seerr:/app/config
    networks:
      - traefik
      - media
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:5055/api/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.rule=Host(`seerr.jaw.dev`)"
      - "traefik.http.routers.seerr.entrypoints=websecure"
      # - "traefik.http.routers.seerr.middlewares=google-auth-user@file"
      - "traefik.http.routers.seerr-auth.middlewares=rate-limit-auth@file"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
      # Bypass forward auth for Plex OAuth callbacks (requires valid Plex token anyway)
      # - "traefik.http.routers.seerr-auth.rule=Host(`seerr.jaw.dev`) && PathPrefix(`/api/v1/auth`)"
      # - "traefik.http.routers.seerr-auth.entrypoints=websecure"
      # - "traefik.http.routers.seerr-auth.middlewares=rate-limit-auth@file"
      - "traefik.http.routers.seerr-auth.service=seerr"

  seerr-borgmatic:
    container_name: seerr-borgmatic
    image: ghcr.io/borgmatic-collective/borgmatic:2.1.3@sha256:529ef5f19838b650e07de2cdf91e0f403d849cf83636baacc6ec8a55e2a76f79
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/seerr:/source/data
      - /home/jaw/backup/seerr:/repository
      - /home/jaw/data/seerr/borgmatic:/borgmatic/state
      - ./borgmatic-config.yml:/etc/borgmatic/config.yaml:ro
      - ./borgmatic-crontab.txt:/etc/borgmatic.d/crontab.txt:ro
    networks:
      - backup
    healthcheck:
      test: ["CMD-SHELL", "borgmatic --version"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik:
    external: true
  media:
    external: true
  backup:
    external: true
