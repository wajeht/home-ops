x-docker-cd:
  rolling_update: false

services:
  seerr:
    container_name: seerr
    image: seerr/seerr:v3.5.0@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/seerr:/app/config
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:5055/api/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.rule=Host(`seerr.jaw.dev`)"
      - "traefik.http.routers.seerr.entrypoints=websecure"
      - "traefik.http.routers.seerr.middlewares=oauth2-media@file"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"

networks:
  traefik:
    external: true
