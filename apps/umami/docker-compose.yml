x-docker-cd:
  rolling_update: false

services:
  umami:
    container_name: umami
    image: ghcr.io/umami-software/umami:postgresql-v2.20.2@sha256:950133e4158949061b84fa29ce1a87f734655dca5a49a08e727eb23c4e3582cd
    env_file:
      - .env # docker-cd decrypts .env.sops -> .env (APP_SECRET, POSTGRES_PASSWORD)
    environment:
      - DATABASE_URL=postgresql://umami:${POSTGRES_PASSWORD}@umami-db:5432/umami
      - DISABLE_TELEMETRY=1
      - TZ=America/Chicago
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - traefik
      - umami-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      # Tracking endpoints must stay public — visitors' browsers load /script.js and POST /api/send.
      - "traefik.http.routers.umami-public.rule=Host(`umami.jaw.dev`) && (Path(`/script.js`) || PathPrefix(`/api/send`))"
      - "traefik.http.routers.umami-public.entrypoints=websecure"
      - "traefik.http.routers.umami-public.priority=100"
      - "traefik.http.routers.umami-public.middlewares=rate-limit-global@file"
      # Everything else (dashboard, login, admin API) sits behind oauth.
      - "traefik.http.routers.umami.rule=Host(`umami.jaw.dev`)"
      - "traefik.http.routers.umami.entrypoints=websecure"
      - "traefik.http.routers.umami.middlewares=oauth2-admin@file"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"

  umami-db:
    container_name: umami-db
    image: postgres:17-alpine@sha256:4649d4ce53680767b3ba9a57f814d7ffa5cd694a03bba551576fb3dd6cb90b01
    env_file:
      - .env # POSTGRES_PASSWORD
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - /home/jaw/data/umami/db:/var/lib/postgresql/data
    networks:
      - umami-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    shm_size: 256m
    stop_grace_period: 30s
    oom_score_adj: -300
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik:
    external: true
  umami-internal:
