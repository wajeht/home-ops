services:
  zepp:
    image: ghcr.io/wajeht/zepp:9e9aecb
    container_name: zepp
    env_file:
      - .env.sops
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/zepp:/usr/src/app/dist/src/db/sqlite
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /usr/src/app/exports
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zepp.rule=Host(`zepp.jaw.dev`)"
      - "traefik.http.routers.zepp.entrypoints=websecure"
      - "traefik.http.routers.zepp.middlewares=google-auth@file"
      - "traefik.http.services.zepp.loadbalancer.server.port=80"

  zepp-borgmatic:
    container_name: zepp-borgmatic
    image: ghcr.io/borgmatic-collective/borgmatic:2.1.5@sha256:f6b0a640d72bf7bb628479246e7c919404917cc58ddc6cdfb8d2d40d786d3a26
    env_file:
      - .env.sops
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/zepp:/source/data
      - /home/jaw/backup/zepp:/repository
      - /home/jaw/data/zepp/borgmatic:/borgmatic/state
      - ./borgmatic-config.yml:/etc/borgmatic/config.yaml:ro
      - ./borgmatic-crontab.txt:/etc/borgmatic.d/crontab.txt:ro
    networks:
      - backup
    healthcheck:
      test: ["CMD-SHELL", "borgmatic --version"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik:
    external: true
  backup:
    external: true
