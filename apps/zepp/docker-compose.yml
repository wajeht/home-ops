services:
  zepp:
    image: ghcr.io/wajeht/zepp:69cfc50@sha256:0ff4770f6c4b46598edf1e60873423861a2a336c19273a1a80f08f17958c9430
    container_name: zepp
    env_file:
      - .env.sops
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/zepp:/usr/src/app/dist/src/db/sqlite
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /usr/src/app/exports
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zepp.rule=Host(`zepp.jaw.dev`)"
      - "traefik.http.routers.zepp.entrypoints=websecure"
      - "traefik.http.routers.zepp.middlewares=oauth2-admin@file"
      - "traefik.http.services.zepp.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
