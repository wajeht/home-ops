x-docker-cd:
  rolling_update: false

services:
  sabnzbd:
    image: linuxserver/sabnzbd:5.1.2-unstable@sha256:1ab67fd17ce7e686c3b9d5207e98211efe99cf05877bf144193bec51b7be1d1e
    container_name: sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - HOST_WHITELIST_ENTRIES=sabnzbd.jaw.dev
    volumes:
      - /home/jaw/data/sabnzbd:/config
      - /home/jaw/plex:/data
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    # lint-ignore: init  # LinuxServer.io s6-overlay must be PID 1
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.jaw.dev`)"
      - "traefik.http.routers.sabnzbd.entrypoints=websecure"
      - "traefik.http.routers.sabnzbd.middlewares=oauth2-admin@file"
      - "traefik.http.services.sabnzbd.loadbalancer.server.port=8080"

networks:
  traefik:
    external: true
