source_directories:
  - /source/data

exclude_patterns:
  - "*/borgmatic"
  - "*/history1.db*"
  - "*/logs"
  - "*/cache"
  - "*/Downloads"

sqlite_databases:
  - name: sabnzbd-history
    path: /source/data/admin/history1.db

repositories:
  - path: /repository
    label: nas
  - path: /local-backup
    label: local

archive_name_format: "sabnzbd-{now:%Y-%m-%d-%H%M%S}"
compression: zstd,3

keep_daily: 7
keep_weekly: 4
keep_monthly: 6

checks:
  - name: repository
    frequency: 1 week
  - name: archives
    frequency: 1 week

check_last: 3

ntfy:
  topic: borgmatic
  server: http://ntfy:80
  finish:
    title: "sabnzbd backup complete"
    message: "sabnzbd backup finished"
    priority: min
    tags: white_check_mark
  fail:
    title: "sabnzbd backup FAILED"
    message: "sabnzbd backup failed"
    priority: max
    tags: skull
  states:
    - finish
    - fail
