services:
  hydra-server:
    container_name: hydra-server
    image: ghcr.io/wajeht/hydra-server:v0.0.1@sha256:ab6d99d3e346ad56ab21eee95f67ccc9018023154599c2fccb0926e4be801c64
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - IS_CUSTOM_SERVER=true
    volumes:
      - /home/jaw/data/hydra-server/data:/data
      - /home/jaw/data/hydra-server/config:/app/config
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hydra-server.rule=Host(`hydra-server.jaw.dev`)"
      - "traefik.http.routers.hydra-server.entrypoints=websecure"
      - "traefik.http.routers.hydra-server.middlewares=rate-limit-global@file"
      - "traefik.http.services.hydra-server.loadbalancer.server.port=3000"

networks:
  traefik:
    external: true
