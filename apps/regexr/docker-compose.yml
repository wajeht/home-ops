x-docker-cd:
  rolling_update: false

services:
  regexr:
    image: ghcr.io/wajeht/regexr:v1.0.4@sha256:2bc94ea79cf23294742fb8590640c0b53811eef3594418fc78325cfb549b9016
    networks:
      - traefik
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          'exit(@file_get_contents("http://127.0.0.1:8080/healthz") === "ok\n" ? 0 : 1);',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.regexr.rule=Host(`regex.jaw.dev`)"
      - "traefik.http.routers.regexr.entrypoints=websecure"
      - "traefik.http.routers.regexr.middlewares=rate-limit-global@file"
      - "traefik.http.services.regexr.loadbalancer.server.port=8080"

networks:
  traefik:
    external: true
