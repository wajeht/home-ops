services:
  avahi:
    container_name: avahi
    image: flungo/avahi:latest@sha256:803451d0200610298d30d3151240f47c5de4d6558f6a3a36340692048cdf28e0
    environment:
      - REFLECTOR_ENABLE_REFLECTOR=yes
      - SERVER_USE_IPV4=yes
      - SERVER_USE_IPV6=no
    command: ["avahi-daemon", "--no-drop-root", "--no-chroot"]
    healthcheck:
      test: ["CMD", "avahi-daemon", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik
      - lan
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik:
    external: true
  lan:
    driver: macvlan
    driver_opts:
      parent: enp0s31f6
    ipam:
      config:
        - subnet: 192.168.4.0/24
          gateway: 192.168.4.1
          ip_range: 192.168.4.200/30
