x-docker-cd:
  rolling_update: false

services:
  videos:
    image: ghcr.io/wajeht/videos:v1.0.150@sha256:2022a08fb535de5742eed226ddff1f1b7614a6ffe7d108a744c6747594448019
    env_file:
      - .env # docker-cd decrypts .env.sops -> .env (SESSION_SECRET)
    environment:
      TZ: America/Chicago
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 80
      VIDEOS_DIR: /videos
      DATA_DIR: /data
      SCAN_INTERVAL_MS: 300000
      QSV_DEVICE: /dev/dri/renderD128
    volumes:
      - /home/jaw/data/videos:/data
      - /home/jaw/plex/videos:/videos:ro
    devices:
      - /dev/dri:/dev/dri
    networks:
      - traefik
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:80/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.videos.rule=Host(`videos.jaw.dev`)"
      - "traefik.http.routers.videos.entrypoints=websecure"
      - "traefik.http.routers.videos.middlewares=rate-limit-global@file"
      - "traefik.http.services.videos.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
