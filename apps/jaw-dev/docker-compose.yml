services:
  www:
    image: ghcr.io/wajeht/jaw.dev:5508915@sha256:b6300ce5f6070c63340e44e6ba513d5c78bd1db42d96b4938b77e6c3ead63c31
    environment:
      - TZ=America/Chicago
      - HTTP_PORT=80
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jaw-dev.rule=Host(`jaw.dev`) || Host(`www.jaw.dev`)"
      - "traefik.http.routers.jaw-dev.entrypoints=websecure"
      - "traefik.http.routers.jaw-dev.middlewares=rate-limit-global@file"
      - "traefik.http.services.jaw-dev.loadbalancer.server.port=80"
networks:
  traefik:
    external: true
