x-docker-cd:
  rolling_update: true

services:
  www:
    image: ghcr.io/wajeht/jaw.dev:72399f7@sha256:e37764a1c51f8aff076a23970557f73df87b293b3d4eb49000ff0bb7e34dabfc
    environment:
      - TZ=America/Chicago
      - HTTP_PORT=80
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jaw-dev.rule=Host(`jaw.dev`) || Host(`www.jaw.dev`)"
      - "traefik.http.routers.jaw-dev.entrypoints=websecure"
      - "traefik.http.routers.jaw-dev.middlewares=rate-limit-global@file"
      - "traefik.http.services.jaw-dev.loadbalancer.server.port=80"
networks:
  traefik:
    external: true
