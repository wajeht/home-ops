x-docker-cd:
  rolling_update: false

services:
  gluetun:
    image: qmcgaw/gluetun:v3.41@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: gluetun
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
      - SERVER_COUNTRIES=United States
      - SERVER_CITIES=Dallas Texas
      - WIREGUARD_MTU=1400
      - FIREWALL_VPN_INPUT_PORTS=45839
      - BLOCK_MALICIOUS=off
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
    tmpfs:
      - /tmp
    volumes:
      - /home/jaw/data/gluetun:/gluetun
    networks:
      - traefik
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vpn-qbit.rule=Host(`qbit.jaw.dev`)"
      - "traefik.http.routers.vpn-qbit.entrypoints=websecure"
      - "traefik.http.routers.vpn-qbit.middlewares=oauth2-admin-no-ratelimit@file"
      - "traefik.http.services.vpn-qbit.loadbalancer.server.port=8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9999 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  qbittorrent:
    image: linuxserver/qbittorrent:5.2.3-libtorrentv1@sha256:9e558115e54604b95b08cd67c9672142b1e7b23a4919b8e3ee7869b05f7d9d4c
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - WEBUI_PORT=8085
    volumes:
      - /home/jaw/data/qbittorrent:/config
      - /home/jaw/plex:/data
      - ./init/remove-stale-lock.sh:/custom-cont-init.d/remove-stale-lock.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    # lint-ignore: init  # LinuxServer.io qbittorrent uses s6-overlay, must be PID 1
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

networks:
  traefik:
    external: true
