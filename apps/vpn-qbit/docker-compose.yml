services:
  gluetun:
    image: qmcgaw/gluetun:v3.41@sha256:1a5bf4b4820a879cdf8d93d7ef0d2d963af56670c9ebff8981860b6804ebc8ab
    container_name: gluetun
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
      - SERVER_COUNTRIES=United States
      - SERVER_CITIES=Dallas Texas
      - WIREGUARD_MTU=1400
      - FIREWALL_VPN_INPUT_PORTS=45839
      - BLOCK_MALICIOUS=off
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
    tmpfs:
      - /tmp
    volumes:
      - /home/jaw/data/gluetun:/gluetun
    networks:
      - traefik
      - media
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vpn-qbit.rule=Host(`qbit.jaw.dev`)"
      - "traefik.http.routers.vpn-qbit.entrypoints=websecure"
      - "traefik.http.routers.vpn-qbit.middlewares=google-auth@file"
      - "traefik.http.services.vpn-qbit.loadbalancer.server.port=8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9999 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  qbittorrent:
    image: linuxserver/qbittorrent:5.1.4-r2-ls445@sha256:855e5f4805ac218f406a5ae989a62a77e03f7e5f70128335b7970550a58c96e1
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - WEBUI_PORT=8085
      - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest@sha256:3da222c098e686ca4157c913c2b553dd48dfb1f5c5453c388c680d51c7fb8a62
    volumes:
      - /home/jaw/data/qbittorrent:/config
      - /home/jaw/plex:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  vpn-qbit-borgmatic:
    container_name: vpn-qbit-borgmatic
    image: ghcr.io/borgmatic-collective/borgmatic:2.1.5@sha256:f6b0a640d72bf7bb628479246e7c919404917cc58ddc6cdfb8d2d40d786d3a26
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/qbittorrent:/source/qbittorrent
      - /home/jaw/data/gluetun:/source/gluetun
      - /home/jaw/backup/vpn-qbit:/repository
      - /home/jaw/data/qbittorrent/borgmatic:/borgmatic/state
      - ./borgmatic-config.yml:/etc/borgmatic/config.yaml:ro
      - ./borgmatic-crontab.txt:/etc/borgmatic.d/crontab.txt:ro
    networks:
      - backup
    healthcheck:
      test: ["CMD-SHELL", "borgmatic --version"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik:
    external: true
  media:
    external: true
  backup:
    external: true
