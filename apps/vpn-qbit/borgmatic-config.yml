source_directories:
  - /source/qbittorrent
  - /source/gluetun

exclude_patterns:
  - "*/borgmatic"
  - "*/logs"
  - "*/cache"
  - "*/ipc-socket"

repositories:
  - path: /repository
    label: nas
  - path: /local-backup
    label: local

archive_name_format: "vpn-qbit-{now:%Y-%m-%d-%H%M%S}"
compression: zstd,3

keep_daily: 7
keep_weekly: 4
keep_monthly: 6

checks:
  - name: repository
    frequency: 1 week
  - name: archives
    frequency: 1 week

check_last: 3

ntfy:
  topic: borgmatic
  server: http://ntfy:80
  finish:
    title: "vpn-qbit backup complete"
    message: "vpn-qbit backup finished"
    priority: min
    tags: white_check_mark
  fail:
    title: "vpn-qbit backup FAILED"
    message: "vpn-qbit backup failed"
    priority: max
    tags: skull
  states:
    - finish
    - fail
