x-docker-cd:
  rolling_update: true

services:
  mm2us:
    image: ghcr.io/wajeht/mm2us.com:3db4292@sha256:284d035e27e722f3dc5771fb965d2eab298b7ec85bb49e0b983b66c51c4195ed
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/mm2us:/usr/src/app/dist/src/db/sqlite
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mm2us.rule=Host(`mm2us.com`) || Host(`www.mm2us.com`)"
      - "traefik.http.routers.mm2us.entrypoints=websecure"
      - "traefik.http.routers.mm2us.middlewares=rate-limit-global@file"
      - "traefik.http.services.mm2us.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
