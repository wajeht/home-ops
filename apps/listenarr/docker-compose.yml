services:
  listenarr:
    container_name: listenarr
    image: ghcr.io/listenarrs/listenarr:canary@sha256:2219c52dfcc523894bcd9c5ca01e6bc817438f6f4e414e77e1e33de2c5c5294d
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/listenarr:/app/config
      - /home/jaw/plex/audiobooks:/audiobooks
      - /home/jaw/plex:/data
    networks:
      - traefik
      - media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4545"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.listenarr.rule=Host(`listenarr.jaw.dev`)"
      - "traefik.http.routers.listenarr.entrypoints=websecure"
      - "traefik.http.routers.listenarr.middlewares=google-auth@file"
      - "traefik.http.services.listenarr.loadbalancer.server.port=4545"

networks:
  traefik:
    external: true
  media:
    external: true
