services:
  listenarr:
    container_name: listenarr
    image: ghcr.io/listenarrs/listenarr:canary@sha256:6367e8752db2670ccd1392800d5a99341707e2611786f8d81ed2254b13a647be
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/listenarr:/app/config
      - /home/jaw/plex/audiobooks:/audiobooks
      - /home/jaw/plex:/data
    networks:
      - traefik
      - media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4545"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.listenarr.rule=Host(`listenarr.jaw.dev`)"
      - "traefik.http.routers.listenarr.entrypoints=websecure"
      - "traefik.http.routers.listenarr.middlewares=google-auth@file"
      - "traefik.http.services.listenarr.loadbalancer.server.port=4545"

  listenarr-borgmatic:
    container_name: listenarr-borgmatic
    image: ghcr.io/borgmatic-collective/borgmatic:2.1.3@sha256:529ef5f19838b650e07de2cdf91e0f403d849cf83636baacc6ec8a55e2a76f79
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/listenarr:/source/data
      - /home/jaw/backup/listenarr:/repository
      - /mnt/sata/backup/listenarr:/local-backup
      - /home/jaw/data/listenarr/borgmatic:/borgmatic/state
      - ./borgmatic-config.yml:/etc/borgmatic/config.yaml:ro
      - ./borgmatic-crontab.txt:/etc/borgmatic.d/crontab.txt:ro
    networks:
      - backup
    healthcheck:
      test: ["CMD-SHELL", "borgmatic --version"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik:
    external: true
  media:
    external: true
  backup:
    external: true
