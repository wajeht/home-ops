auth:
  enabled: true
  trusted_proxies:
    - 172.18.0.0/16
  failed_login_rate_limit: "1/second;5/minute;20/hour"

tls:
  enabled: false

proxy:
  header_map:
    user: X-Forwarded-User

mqtt:
  enabled: true
  host: mosquitto
  port: 1883

database:
  path: /config/frigate.db

detectors:
  ov:
    type: openvino
    device: GPU

model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/yolov9-t-320.onnx
  labelmap_path: /labelmap/coco-80.txt

ffmpeg:
  output_args:
    record: preset-record-generic-audio-aac

audio:
  enabled: true
  listen:
    - fire_alarm
    - scream
    - yell
    - glass_breaking

objects:
  track:
    - person
    # - dog
    # - cat
  filters:
    person:
      min_score: 0.5
      threshold: 0.7
      min_area: 1500
      max_area: 100000

birdseye:
  enabled: true
  mode: objects
  width: 1280
  height: 720

# semantic_search:
#   enabled: true
#   model_size: small

face_recognition:
  enabled: true
  model_size: small

notifications:
  enabled: true
  cooldown: 30

review:
  alerts:
    labels:
      - person

record:
  enabled: true
  retain:
    days: 30
    mode: motion

snapshots:
  enabled: true
  clean_copy: false
  retain:
    default: 30

go2rtc:
  api:
    origin: "*"
  webrtc:
    candidates:
      - 192.168.4.161:8555
  streams:
    tapo_cam:
      - rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASS}@{FRIGATE_CAM_IP}:554/stream1#backchannel=0
      - "ffmpeg:tapo_cam#video=h264#hardware=vaapi"
      - tapo://admin:{FRIGATE_TAPO_SHA256}@{FRIGATE_CAM_IP}
    tapo_cam_sub:
      - rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASS}@{FRIGATE_CAM_IP}:554/stream2

cameras:
  tapo_cam:
    enabled: true
    onvif:
      # TODO: env var {FRIGATE_CAM_IP} doesn't resolve here — Frigate bug, ONVIF module skips env substitution
      host: 192.168.30.56
      port: 2020
      user: "{FRIGATE_CAM_USER}"
      password: "{FRIGATE_CAM_PASS}"
      autotracking:
        enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/tapo_cam
          roles:
            - record
            - audio
        - path: rtsp://127.0.0.1:8554/tapo_cam_sub
          roles:
            - detect
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    motion:
      contour_area: 25
      lightning_threshold: 0.8
      improve_contrast: true
    objects:
      track:
        - person
        # - dog
        # - cat
    record:
      enabled: true
    snapshots:
      enabled: true
