auth:
  enabled: false

mqtt:
  enabled: true
  host: mosquitto
  port: 1883

database:
  path: /config/frigate.db

detectors:
  ov:
    type: openvino
    device: GPU
    model:
      path: /openvino-model/ssdlite_mobilenet_v2.xml

ffmpeg:
  hwaccel_args: preset-vaapi

objects:
  track:
    - person
    # - dog
    # - cat

record:
  enabled: true
  retain:
    days: 1
    mode: motion

snapshots:
  enabled: true
  retain:
    default: 2

go2rtc:
  webrtc:
    candidates:
      - 192.168.4.161:8555
  streams:
    tapo_cam:
      - rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASS}@{FRIGATE_CAM_IP}:554/stream1
      - "ffmpeg:tapo_cam#video=h264#hardware=vaapi"

cameras:
  tapo_cam:
    enabled: true
    onvif:
      host: "{FRIGATE_CAM_IP}"
      port: 2020
      user: "{FRIGATE_CAM_USER}"
      password: "{FRIGATE_CAM_PASS}"
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/tapo_cam
          roles:
            - record
        - path: rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASS}@{FRIGATE_CAM_IP}:554/stream2
          roles:
            - detect
    detect:
      width: 640
      height: 360
      fps: 5
    objects:
      track:
        - person
        # - dog
        # - cat
    record:
      enabled: true
    snapshots:
      enabled: true
