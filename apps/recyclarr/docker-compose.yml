services:
  recyclarr:
    container_name: recyclarr
    image: ghcr.io/recyclarr/recyclarr:8.5.0@sha256:5da14297a11aa910582d800f0edcb8f9e9d488642083c01dc34950f6449d9214
    user: 1000:1000
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
      - CRON_SCHEDULE=@daily
    volumes:
      - /home/jaw/data/recyclarr:/config
      - ./recyclarr.yml:/config/recyclarr.yml:ro
    networks:
      - media
    healthcheck:
      test: ["CMD-SHELL", "recyclarr --version >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  media:
    external: true
