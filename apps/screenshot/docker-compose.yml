x-docker-cd:
  rolling_update: true

services:
  screenshot:
    image: ghcr.io/wajeht/screenshot:ed79ec4@sha256:038ad9be760c60a07250e19c97d0cfb428d64e8c4a1f58abb64614e2cc0a2319
    environment:
      TZ: America/Chicago
      APP_ENV: production
      APP_PORT: 80
    env_file:
      - .env
    volumes:
      - /home/jaw/data/screenshot:/app/data
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.screenshot.rule=Host(`screenshot.jaw.dev`)"
      - "traefik.http.routers.screenshot.entrypoints=websecure"
      - "traefik.http.routers.screenshot.middlewares=rate-limit-global@file"
      - "traefik.http.services.screenshot.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
