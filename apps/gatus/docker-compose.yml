services:
  gatus:
    container_name: gatus
    image: ghcr.io/twin/gatus:stable@sha256:c5f210d095fa78e6efaa20ffeb14803f2ba4f10615e16a6d12087697149617f0
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
      - GATUS_CONFIG_PATH=/config
      - GATUS_LOG_LEVEL=INFO
    volumes:
      - ./config:/config:ro
      - ./httpcheck:/httpcheck:ro
      - /home/jaw/data/gatus:/data
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "/httpcheck", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gatus.rule=Host(`gatus.jaw.dev`)"
      - "traefik.http.routers.gatus.entrypoints=websecure"
      - "traefik.http.routers.gatus.middlewares=oauth2-admin@file"
      - "traefik.http.services.gatus.loadbalancer.server.port=8080"

networks:
  traefik:
    external: true
