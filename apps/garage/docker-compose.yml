x-docker-cd:
  rolling_update: false

services:
  garage:
    container_name: garage
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    env_file:
      - .env
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - /home/jaw/data/garage/meta:/var/lib/garage/meta
      - /home/jaw/data/garage/data:/var/lib/garage/data
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.garage.rule=Host(`s3.jaw.dev`)"
      - "traefik.http.routers.garage.entrypoints=websecure"
      - "traefik.http.routers.garage.middlewares=rate-limit-global@file"
      - "traefik.http.services.garage.loadbalancer.server.port=3900"

  garage-webui:
    container_name: garage-webui
    image: khairul169/garage-webui:1.1.0@sha256:17c793551873155065bf9a022dabcde874de808a1f26e648d4b82e168806439c
    environment:
      - API_BASE_URL=http://garage:3903
      - S3_ENDPOINT_URL=http://garage:3900
      - API_ADMIN_KEY=${GARAGE_ADMIN_TOKEN}
    env_file:
      - .env
    depends_on:
      garage:
        condition: service_healthy
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:3909"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.garage-webui.rule=Host(`garage.jaw.dev`)"
      - "traefik.http.routers.garage-webui.entrypoints=websecure"
      - "traefik.http.routers.garage-webui.middlewares=oauth2-admin@file"
      - "traefik.http.services.garage-webui.loadbalancer.server.port=3909"

networks:
  traefik:
    external: true
