services:
  dbgate:
    container_name: dbgate
    image: dbgate/dbgate:7.1.12@sha256:07274ad869e86a609b4ab78e6a0c261f106ed6bbd5a10eff0895f65d04b439e6
    env_file:
      - .env
    volumes:
      - /home/jaw/data/dbgate:/root/.dbgate
      - /home/jaw/data/close-powerlifting:/mnt/close-powerlifting
      - /home/jaw/data/bang:/mnt/bang
      - /home/jaw/data/favicon:/mnt/favicon
      - /home/jaw/data/screenshot:/mnt/screenshot
      - /home/jaw/data/calendar:/mnt/calendar
    networks:
      - traefik
      - hello-world-internal
      - immich-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dbgate.rule=Host(`dbgate.jaw.dev`)"
      - "traefik.http.routers.dbgate.entrypoints=websecure"
      - "traefik.http.routers.dbgate.middlewares=google-auth@file"
      - "traefik.http.services.dbgate.loadbalancer.server.port=3000"

networks:
  traefik:
    external: true
  hello-world-internal:
    external: true
    name: hello-world_internal
  immich-internal:
    external: true
    name: immich_immich-internal
