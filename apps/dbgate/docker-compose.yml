services:
  dbgate:
    container_name: dbgate
    image: dbgate/dbgate:latest@sha256:08bb2ab91434c7d1ac95f8545ab2ca927ef732af5d3510afccd711d08fec4c63
    env_file:
      - .env
    volumes:
      - /home/jaw/data/dbgate:/root/.dbgate
      - /home/jaw/data/close-powerlifting:/mnt/close-powerlifting
      - /home/jaw/data/bang:/mnt/bang
      - /home/jaw/data/favicon:/mnt/favicon
      - /home/jaw/data/screenshot:/mnt/screenshot
      - /home/jaw/data/calendar:/mnt/calendar
    networks:
      - traefik
      # - miniflux-internal
      - hello-world-internal
      - immich-internal
      # - plausible-internal
      # - zipline-internal
      # - glitchtip-internal
      # - bitmagnet-internal
      # - paperless-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dbgate.rule=Host(`dbgate.jaw.dev`)"
      - "traefik.http.routers.dbgate.entrypoints=websecure"
      - "traefik.http.routers.dbgate.middlewares=google-auth@file"
      - "traefik.http.services.dbgate.loadbalancer.server.port=3000"

  dbgate-borgmatic:
    container_name: dbgate-borgmatic
    image: ghcr.io/borgmatic-collective/borgmatic:2.1.4@sha256:201001bead2ad04bd46567def5cc63fe277749a1ee7f2e544eb0a415b64f6706
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/dbgate:/source/data
      - /home/jaw/backup/dbgate:/repository
      - /home/jaw/data/dbgate/borgmatic:/borgmatic/state
      - ./borgmatic-config.yml:/etc/borgmatic/config.yaml:ro
      - ./borgmatic-crontab.txt:/etc/borgmatic.d/crontab.txt:ro
    networks:
      - backup
    healthcheck:
      test: ["CMD-SHELL", "borgmatic --version"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik:
    external: true
  backup:
    external: true
  # miniflux-internal:
  #   external: true
  #   name: miniflux_miniflux-internal
  hello-world-internal:
    external: true
    name: hello-world_internal
  immich-internal:
    external: true
    name: immich_immich-internal
