services:
  dbgate:
    container_name: dbgate
    image: dbgate/dbgate:7.1.11@sha256:4192d22119afa969750c94b825b06dec77054c36a1f4be5a34e2bc31f2719111
    env_file:
      - .env
    volumes:
      - /home/jaw/data/dbgate:/root/.dbgate
      - /home/jaw/data/close-powerlifting:/mnt/close-powerlifting
      - /home/jaw/data/bang:/mnt/bang
      - /home/jaw/data/favicon:/mnt/favicon
      - /home/jaw/data/screenshot:/mnt/screenshot
      - /home/jaw/data/calendar:/mnt/calendar
    networks:
      - traefik
      # - miniflux-internal
      - hello-world-internal
      - immich-internal
      # - plausible-internal
      # - glitchtip-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dbgate.rule=Host(`dbgate.jaw.dev`)"
      - "traefik.http.routers.dbgate.entrypoints=websecure"
      - "traefik.http.routers.dbgate.middlewares=google-auth@file"
      - "traefik.http.services.dbgate.loadbalancer.server.port=3000"

networks:
  traefik:
    external: true
  # miniflux-internal:
  #   external: true
  #   name: miniflux_miniflux-internal
  hello-world-internal:
    external: true
    name: hello-world_internal
  immich-internal:
    external: true
    name: immich_immich-internal
  # plausible-internal:
  #   external: true
  #   name: plausible_plausible-internal
  # glitchtip-internal:
  #   external: true
  #   name: glitchtip_glitchtip-internal
