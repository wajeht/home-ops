x-docker-cd:
  rolling_update: false

services:
  bazarr:
    container_name: bazarr
    image: linuxserver/bazarr:1.5.7-development@sha256:25ea6f5f31658d7581495ef3f8dc2e35e892fa30e3eae9808341928d4c9ef942
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/bazarr:/config
      - /home/jaw/plex:/data
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    # lint-ignore: init  # LinuxServer.io s6-overlay must be PID 1
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.jaw.dev`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.middlewares=oauth2-admin@file"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"

networks:
  traefik:
    external: true
