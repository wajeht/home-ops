services:
  www:
    image: ghcr.io/wajeht/jaw.dev:1ab7692@sha256:f4f116658f5e93795ccf6d23a30150c7b1cd1789ba44c23f76dab35572fca0d7
    environment:
      - TZ=America/Chicago
      - HTTP_PORT=80
    networks:
      - traefik
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - http://localhost:80
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.http.routers.jaw-dev-pr-38.rule=Host(`pr-38-jaw-dev.jaw.dev`) || Host(`pr-38-jaw-dev.jaw.dev`)
      - traefik.http.routers.jaw-dev-pr-38.entrypoints=websecure
      - traefik.http.routers.jaw-dev-pr-38.middlewares=oauth2-admin@file
      - traefik.http.services.jaw-dev-pr-38.loadbalancer.server.port=80
networks:
  traefik:
    external: true
