x-docker-cd:
  rolling_update: false

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.7.0@sha256:cb76c9922b530f6a5063a15463eb3ad6de287d297c826713abda16795bb98980
    volumes:
      - /home/jaw/data/homeassistant:/config
    environment:
      - TZ=America/Chicago
    ports:
      - "8123:8123"
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    # lint-ignore: init  # home-assistant uses s6, must be PID 1
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      # Browser access — protected by oauth2-admin
      - "traefik.http.routers.homeassistant.rule=Host(`ha.jaw.dev`)"
      - "traefik.http.routers.homeassistant.entrypoints=websecure"
      - "traefik.http.routers.homeassistant.middlewares=oauth2-admin@file"
      # Companion App — HA's own auth + rate limiting (no oauth2-admin)
      - "traefik.http.routers.homeassistant-app.rule=Host(`ha-app.jaw.dev`)"
      - "traefik.http.routers.homeassistant-app.entrypoints=websecure"
      - "traefik.http.routers.homeassistant-app.middlewares=rate-limit-global@file"
      - "traefik.http.services.homeassistant.loadbalancer.server.port=8123"

networks:
  traefik:
    external: true
