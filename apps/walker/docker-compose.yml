x-docker-cd:
  rolling_update: false
  ignore_deployment: true

services:
  # lint-ignore: backup  # cache-only (just a small JSON of configured repos, auto-regenerates)
  walker:
    image: ghcr.io/wajeht/walker:v0.0.15@sha256:4425f2d9dc2b3d7a62802393567d42cc01e2e7c650296889212c020a77e4398a
    container_name: walker
    env_file:
      - .env
    environment:
      TZ: America/Chicago
      NOTIFICATION_URL: http://ntfy:80/walker?template=walker&markdown=yes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/jaw/data/walker:/data
      - /home/jaw/data/walker-cache:/cache
      - ./walker.yml:/config/walker.yml:ro
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.walker.rule=Host(`walker.jaw.dev`)"
      - "traefik.http.routers.walker.entrypoints=websecure"
      - "traefik.http.routers.walker.middlewares=oauth2-admin@file"
      - "traefik.http.services.walker.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
