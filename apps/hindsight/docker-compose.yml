services:
  hindsight:
    container_name: hindsight
    image: ghcr.io/vectorize-io/hindsight:0.5.6@sha256:520aa66460c49b594f47ce212c590061c407be4576399c9fbd7f1826d2a3ca9c
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
      - HINDSIGHT_API_RETAIN_BATCH_ENABLED=false
    volumes:
      - /home/jaw/data/hindsight/pg:/home/hindsight/.pg0
    networks:
      - traefik
    ports:
      - "8888:8888"
      - "9999:9999"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    shm_size: 256m
    stop_grace_period: 30s
    oom_score_adj: -300
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 3G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hindsight.rule=Host(`hindsight.jaw.dev`)"
      - "traefik.http.routers.hindsight.entrypoints=websecure"
      - "traefik.http.routers.hindsight.middlewares=google-auth@file"
      - "traefik.http.services.hindsight.loadbalancer.server.port=9999"

networks:
  traefik:
    external: true
