services:
  hindsight:
    container_name: hindsight
    image: ghcr.io/vectorize-io/hindsight:0.4.22@sha256:f38d694b2dde471024172c4592aecb49b8b32d9829fee9fa8a7ccf40a6f8e3e7
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/hindsight/pg:/home/hindsight/.pg0
    networks:
      - traefik
    ports:
      - "8888:8888"
      - "9999:9999"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    shm_size: 256m
    stop_grace_period: 30s
    oom_score_adj: -300
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 3G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hindsight.rule=Host(`hindsight.jaw.dev`)"
      - "traefik.http.routers.hindsight.entrypoints=websecure"
      - "traefik.http.routers.hindsight.middlewares=google-auth@file"
      - "traefik.http.services.hindsight.loadbalancer.server.port=9999"

  hindsight-borgmatic:
    container_name: hindsight-borgmatic
    image: ghcr.io/borgmatic-collective/borgmatic:2.1.3@sha256:529ef5f19838b650e07de2cdf91e0f403d849cf83636baacc6ec8a55e2a76f79
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/hindsight:/source/data
      - /home/jaw/backup/hindsight:/repository
      - /home/jaw/data/hindsight/borgmatic:/borgmatic/state
      - ./borgmatic-config.yml:/etc/borgmatic/config.yaml:ro
      - ./borgmatic-crontab.txt:/etc/borgmatic.d/crontab.txt:ro
    networks:
      - backup
    healthcheck:
      test: ["CMD-SHELL", "borgmatic --version"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik:
    external: true
  backup:
    external: true
