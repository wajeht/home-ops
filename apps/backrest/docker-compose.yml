# force
services:
  backrest:
    container_name: backrest
    image: ghcr.io/wajeht/backrest:sha-6555d5b@sha256:8a00d9b4b03b7406f9dcc0657379c0d83434c54e9c28ff0957ea8a2635950231
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
      - BACKREST_PORT=0.0.0.0:9898
      - BACKREST_CONFIG=/config/config.json
      - BACKREST_DATA=/data
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/jaw/data:/source
      - /home/jaw/backup/restic:/repos
      - /home/jaw/data/backrest:/data
      - ./config:/config
    tmpfs:
      - /cache
      - /tmp
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backrest.rule=Host(`backrest.jaw.dev`)"
      - "traefik.http.routers.backrest.entrypoints=websecure"
      - "traefik.http.routers.backrest.middlewares=google-auth@file"
      - "traefik.http.services.backrest.loadbalancer.server.port=9898"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9898/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    oom_score_adj: -300

networks:
  traefik:
    external: true
