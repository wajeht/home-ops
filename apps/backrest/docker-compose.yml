# force
services:
  backrest:
    container_name: backrest
    image: ghcr.io/wajeht/backrest:v0.0.1@sha256:f69672d015538c8485cfb055e2b65fcac5dca3f8d87a8cd5f5ed6af8e4d0f374
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
      - BACKREST_PORT=0.0.0.0:9898
      - BACKREST_CONFIG=/config/config.json
      - BACKREST_DATA=/data
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/jaw/data:/source
      - /home/jaw/.sops:/sops:ro
      - /home/jaw/backup/restic:/repos
      - /home/jaw/data/backrest:/data
      - ./config:/config
    tmpfs:
      - /cache
      - /tmp
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backrest.rule=Host(`backrest.jaw.dev`)"
      - "traefik.http.routers.backrest.entrypoints=websecure"
      - "traefik.http.routers.backrest.middlewares=oauth2-admin@file"
      - "traefik.http.services.backrest.loadbalancer.server.port=9898"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9898/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    # lint-ignore: init  # upstream image already runs under tini
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    oom_score_adj: -300

networks:
  traefik:
    external: true
