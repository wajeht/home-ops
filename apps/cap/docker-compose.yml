x-docker-cd:
  rolling_update: false

services:
  cap:
    container_name: cap
    image: tiago2/cap:3.1.5@sha256:97455d85b5517172397c7053837d377c72ded6250777928d5435c3eab2f58779
    env_file:
      - .env # docker-cd decrypts .env.sops -> .env (ADMIN_KEY)
    environment:
      - TZ=America/Chicago
      - REDIS_URL=redis://cap-redis:6379
      - ENABLE_ASSETS_SERVER=true # serve widget.js/wasm from cap.jaw.dev (no CDN dependency)
    volumes:
      - ./portcheck:/portcheck:ro # static healthcheck helper (oven/bun:slim has no curl/wget)
    depends_on:
      cap-redis:
        condition: service_healthy
    networks:
      - traefik
      - cap-internal
    healthcheck:
      test: ["CMD", "/portcheck", "--port", "3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /usr/src/app/data # optional GeoIP cache; core state lives in Redis
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cap.rule=Host(`cap.jaw.dev`)"
      - "traefik.http.routers.cap.entrypoints=websecure"
      - "traefik.http.routers.cap.middlewares=rate-limit-global@file"
      - "traefik.http.services.cap.loadbalancer.server.port=3000"

  cap-redis:
    container_name: cap-redis
    image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    command: redis-server --save 60 1 --maxmemory-policy noeviction --loglevel warning
    volumes:
      - /home/jaw/data/cap/redis:/data
    networks:
      - cap-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    oom_score_adj: -300
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik:
    external: true
  cap-internal:
