services:
  calendar:
    image: ghcr.io/wajeht/calendar:06a3189
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    volumes:
      - calendar:/usr/src/app/src/db/sqlite
    networks:
      - traefik
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - http://localhost:80/healthz
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.http.routers.calendar-pr-103.rule=Host(`pr-103-calendar.jaw.dev`)
      - traefik.http.routers.calendar-pr-103.entrypoints=websecure
      - traefik.http.routers.calendar-pr-103.middlewares=rate-limit-global@file
      - traefik.http.services.calendar-pr-103.loadbalancer.server.port=80
networks:
  traefik:
    external: true
  backup:
    external: true
volumes:
  calendar: null
