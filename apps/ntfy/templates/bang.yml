title: '{{- if eq .severity "error" }}🔴{{ else }}🟠{{ end }} {{ .status }} {{ .errorName }}: {{ .errorMessage }}'

message: |
  **{{ .method }} {{ .path }}** → {{ .status }}
  {{- if .host }} on `{{ .host }}`{{- end }}

  **user:** {{ .user }}
  {{- if .ip }}
  **ip:** `{{ .ip }}`
  {{- end }}
  {{- if .userAgent }}
  **ua:** `{{ .userAgent }}`
  {{- end }}
  {{- if .referer }}
  **referer:** {{ .referer }}
  {{- end }}
  {{- if .query }}
  **query:** `{{ .query }}`
  {{- end }}
  {{- if .body }}
  **body:**
  ```json
  {{ .body }}
  ```
  {{- end }}
  {{- if .cause }}
  **cause:** `{{ .cause }}`
  {{- end }}

  **stack:**
  ```
  {{ .stack }}
  ```

priority: |
  {{- if eq .severity "error" }}4
  {{- else }}3
  {{- end }}

tags: |
  {{- if eq .severity "error" }}rotating_light
  {{- else }}warning
  {{- end }}
