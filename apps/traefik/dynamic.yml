http:
  middlewares:
    # Used by the catch-all router for unknown *.jaw.dev subdomains.
    redirect-to-main:
      redirectRegex:
        regex: ".*"
        replacement: "https://jaw.dev"
        permanent: true

    # Compress normal text responses; skip media formats that are already compressed.
    gzip:
      compress:
        excludedContentTypes:
          - image/png
          - image/jpeg
          - image/gif
          - image/webp
          - video/mp4
          - video/webm
          - video/x-matroska
          - audio/mp4
          - audio/aac
          - application/dash+xml
          - application/vnd.apple.mpegurl

    # Origin lock-down: only Cloudflare edge IPs can reach HTTPS routers.
    cloudflare-only:
      ipAllowList:
        sourceRange:
          - 173.245.48.0/20
          - 103.21.244.0/22
          - 103.22.200.0/22
          - 103.31.4.0/22
          - 141.101.64.0/18
          - 108.162.192.0/18
          - 190.93.240.0/20
          - 188.114.96.0/20
          - 197.234.240.0/22
          - 198.41.128.0/17
          - 162.158.0.0/15
          - 104.16.0.0/13
          - 104.24.0.0/14
          - 172.64.0.0/13
          - 131.0.72.0/22
          - 2400:cb00::/32
          - 2606:4700::/32
          - 2803:f800::/32
          - 2405:b500::/32
          - 2405:8100::/32
          - 2a06:98c0::/29
          - 2c0f:f248::/32

    # Browser-facing safety headers shared by HTTPS apps.
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "same-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customResponseHeaders:
          Cross-Origin-Opener-Policy: "same-origin"
          Cross-Origin-Resource-Policy: "same-site"

    # General rate limit. Uses Cloudflare's real-client IP header.
    rate-limit-global:
      rateLimit:
        period: 1s
        average: 200
        burst: 400
        sourceCriterion:
          requestHeaderName: CF-Connecting-IP

    # Stricter rate limit for auth-protected routes.
    rate-limit-auth:
      rateLimit:
        period: 1s
        average: 10
        burst: 20
        sourceCriterion:
          requestHeaderName: CF-Connecting-IP

    # API-specific rate limit for public endpoints.
    rate-limit-api:
      rateLimit:
        period: 1s
        average: 50
        burst: 100
        sourceCriterion:
          requestHeaderName: CF-Connecting-IP

    # Google auth service for admin-only apps.
    google-auth-forward:
      forwardAuth:
        address: http://google-auth:4181
        trustForwardHeader: true
        maxResponseBodySize: 4096
        authResponseHeaders:
          - X-Forwarded-User

    # Standard admin auth chain: rate limit first, then Google auth.
    google-auth:
      chain:
        middlewares:
          - rate-limit-auth
          - google-auth-forward

    # Admin auth without rate limiting for routes that already limit elsewhere.
    google-auth-no-ratelimit:
      chain:
        middlewares:
          - google-auth-forward

    # Separate Google auth service for user-facing apps.
    google-auth-user-forward:
      forwardAuth:
        address: http://google-auth-user:4181
        trustForwardHeader: true
        maxResponseBodySize: 4096
        authResponseHeaders:
          - X-Forwarded-User

    # User auth chain: rate limit first, then user Google auth.
    google-auth-user:
      chain:
        middlewares:
          - rate-limit-auth
          - google-auth-user-forward

    # User auth without rate limiting for routes that already limit elsewhere.
    google-auth-user-no-ratelimit:
      chain:
        middlewares:
          - google-auth-user-forward

  routers:
    # Low-priority fallback: unknown *.jaw.dev subdomains redirect to jaw.dev.
    catchall:
      rule: "HostRegexp(`[a-z0-9-]+\\.jaw\\.dev`)"
      entrypoints:
        - websecure
      middlewares:
        - redirect-to-main
      service: dummy
      priority: 1
      tls:
        domains:
          - main: jaw.dev
            sans:
              - "*.jaw.dev"

  services:
    # Placeholder service required by redirect-only routers.
    dummy:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1"
