http:
  middlewares:
    redirect-to-main:
      redirectRegex:
        regex: ".*"
        replacement: "https://jaw.dev"
        permanent: true

    gzip:
      compress:
        excludedContentTypes:
          - image/png
          - image/jpeg
          - image/gif
          - image/webp
          - video/mp4
          - video/webm
          - video/x-matroska
          - audio/mp4
          - audio/aac
          - application/dash+xml
          - application/vnd.apple.mpegurl

    cloudflare-only:
      ipAllowList:
        sourceRange:
          - 173.245.48.0/20
          - 103.21.244.0/22
          - 103.22.200.0/22
          - 103.31.4.0/22
          - 141.101.64.0/18
          - 108.162.192.0/18
          - 190.93.240.0/20
          - 188.114.96.0/20
          - 197.234.240.0/22
          - 198.41.128.0/17
          - 162.158.0.0/15
          - 104.16.0.0/13
          - 104.24.0.0/14
          - 172.64.0.0/13
          - 131.0.72.0/22
          - 2400:cb00::/32
          - 2606:4700::/32
          - 2803:f800::/32
          - 2405:b500::/32
          - 2405:8100::/32
          - 2a06:98c0::/29
          - 2c0f:f248::/32

    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customResponseHeaders:
          Cross-Origin-Opener-Policy: "same-origin"
          Cross-Origin-Resource-Policy: "cross-origin"

    rate-limit-global:
      rateLimit:
        period: 1s
        average: 200
        burst: 400
        sourceCriterion:
          requestHeaderName: CF-Connecting-IP

    rate-limit-auth:
      rateLimit:
        period: 1s
        average: 10
        burst: 20
        sourceCriterion:
          requestHeaderName: CF-Connecting-IP

    rate-limit-api:
      rateLimit:
        period: 1s
        average: 50
        burst: 100
        sourceCriterion:
          requestHeaderName: CF-Connecting-IP

    google-auth-forward:
      forwardAuth:
        address: http://google-auth:4181
        trustForwardHeader: true
        maxResponseBodySize: 4096
        authResponseHeaders:
          - X-Forwarded-User

    google-auth:
      chain:
        middlewares:
          - rate-limit-auth
          - google-auth-forward

    google-auth-no-ratelimit:
      chain:
        middlewares:
          - google-auth-forward

    google-auth-user-forward:
      forwardAuth:
        address: http://google-auth-user:4181
        trustForwardHeader: true
        maxResponseBodySize: 4096
        authResponseHeaders:
          - X-Forwarded-User

    google-auth-user:
      chain:
        middlewares:
          - rate-limit-auth
          - google-auth-user-forward

    google-auth-user-no-ratelimit:
      chain:
        middlewares:
          - google-auth-user-forward

  routers:
    # Catch-all for unknown subdomains (low priority)
    catchall:
      rule: "HostRegexp(`[a-z0-9-]+\\.jaw\\.dev`)"
      entrypoints:
        - websecure
      middlewares:
        - redirect-to-main
      service: dummy
      priority: 1
      tls:
        domains:
          - main: jaw.dev
            sans:
              - "*.jaw.dev"

  services:
    # Dummy service for redirects (never actually used)
    dummy:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1"

  serversTransports:
    scrypted-transport:
      insecureSkipVerify: true
