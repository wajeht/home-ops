x-docker-cd:
  rolling_update: false

services:
  # lint-ignore: backup  # stateless — polls GitHub notifications, no persistent data
  clear-renovate-notifications:
    image: ghcr.io/wajeht/clear-renovate-notifications:60fe9a6@sha256:bfafe2935b9673a9528c93b524c0bd77baa5188ef1cfad5f4c9eaf2ab56642a7
    container_name: clear-renovate-notifications
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
      - DRY_RUN=false
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
networks:
  traefik:
    external: true
