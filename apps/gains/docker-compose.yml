x-docker-cd:
  rolling_update: true

services:
  gains:
    image: ghcr.io/wajeht/gains:6f1519b@sha256:511e44053b51516bf7702a678f8193c1884248db5f125d0b16f0045fbcb21177
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/jaw/data/gains:/usr/src/app/src/db/sqlite
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gains.rule=Host(`gains.jaw.dev`)"
      - "traefik.http.routers.gains.entrypoints=websecure"
      - "traefik.http.routers.gains.middlewares=rate-limit-global@file"
      - "traefik.http.services.gains.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
