x-docker-cd:
  rolling_update: false
services:
  course:
    image: ghcr.io/wajeht/course:efd2d23@sha256:0e7f860e6192e89b71b8b57df18222a3edba9051c330e58f13bc20b036ae7d01
    env_file:
      - .env
    environment:
      TZ: America/Chicago
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 80
      VIDEOS_DIR: /videos
      DATA_DIR: /data
      SCAN_INTERVAL_MS: 300000
      QSV_DEVICE: /dev/dri/renderD128
    volumes:
      - course:/data
      - videos:/videos:ro
    devices:
      - /dev/dri:/dev/dri
    networks:
      - traefik
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - fetch('http://127.0.0.1:80/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.http.routers.course-pr-74.rule=Host(`pr-74-course.jaw.dev`)
      - traefik.http.routers.course-pr-74.entrypoints=websecure
      - traefik.http.routers.course-pr-74.middlewares=rate-limit-global@file
      - traefik.http.services.course-pr-74.loadbalancer.server.port=80
networks:
  traefik:
    external: true
volumes:
  course: null
  videos: null
