services:
  crowdsec:
    container_name: crowdsec
    image: crowdsecurity/crowdsec:v1.7.8@sha256:2f527c9bb8b367120eb08b82890aa912ce96bfa1ada93dda0721700e4b4e0dde
    env_file:
      - .env
    environment:
      TZ: America/Chicago
      GID: "1000"
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve"
      CUSTOM_HOSTNAME: crowdsec
      DISABLE_ONLINE_API: "false"
      # WAL mode prevents LAPI from blocking during community-blocklist inserts.
      USE_WAL: "true"
      # Auto-registers the Traefik bouncer at boot using this key.
      BOUNCER_KEY_TRAEFIK: ${BOUNCER_KEY_TRAEFIK}
    volumes:
      - traefik-logs:/var/log/traefik:ro
      - ./acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - /home/jaw/data/crowdsec/db:/var/lib/crowdsec/data
      - /home/jaw/data/crowdsec/config:/etc/crowdsec
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    oom_score_adj: -300
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    labels:
      # Agent exposes no HTTP service; the bouncer middleware lives in apps/traefik/dynamic.yml.
      - "traefik.enable=false"

networks:
  traefik:
    external: true

volumes:
  traefik-logs:
    external: true
