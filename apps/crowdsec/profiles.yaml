# Custom profiles overriding the default. Mirrors upstream defaults except `notifications:`
# is wired to the ntfy plugin so bans are pushed to ntfy.jaw.dev (topic: crowdsec).
# Notification config lives in ./notifications/ntfy.yaml — the `name:` there must match
# the entry in the notifications list below.

name: default_ip_remediation
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Ip"
decisions:
  - type: ban
    duration: 4h
notifications:
  - ntfy
on_success: break

---
name: default_range_remediation
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Range"
decisions:
  - type: ban
    duration: 4h
notifications:
  - ntfy
on_success: break
