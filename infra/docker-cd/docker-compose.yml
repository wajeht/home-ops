services:
  docker-cd:
    image: ghcr.io/wajeht/docker-cd:v0.4.0@sha256:a830bbf72a0575c7eaaf46492a5fa23485ab396e483df90a8ded5f0efcea3d1c
    container_name: docker-cd
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/jaw/data/docker-cd:/home/jaw/data/docker-cd
      - /home/jaw/.sops/age-key.txt:/sops/age-key.txt:ro
      - /home/jaw/.docker/config.json:/root/.docker/config.json:ro
      - ./.gitconfig:/root/.gitconfig:ro
      - /sys/class/thermal:/sys/class/thermal:ro
      - /proc/meminfo:/proc/meminfo:ro
    environment:
      TZ: America/Chicago
      HTTP_PORT: "80"
      LOG_LEVEL: "debug"
      DATA_PATH: /home/jaw/data/docker-cd
      REPO: https://github.com/wajeht/home-ops.git
      BASE_DIR: apps
      BRANCH: main
      INTERVAL: 5m
      SOPS_AGE_KEY_FILE: /sops/age-key.txt
      GIT_ACCESS_TOKEN: ${GIT_ACCESS_TOKEN}
      ENABLE_BADGES: "true"
      API_SECRET: ${API_SECRET}
      NOTIFICATION_URL: http://ntfy:80/docker-cd?template=docker-cd&markdown=yes
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docker-cd-api.rule=Host(`cd.jaw.dev`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.docker-cd-api.entrypoints=websecure"
      - "traefik.http.routers.docker-cd-api.middlewares=rate-limit-api@file"
      - "traefik.http.services.docker-cd.loadbalancer.server.port=80"
      - "traefik.http.routers.docker-cd-api.priority=100"
      - "traefik.http.routers.docker-cd-badges.rule=Host(`cd.jaw.dev`) && PathPrefix(`/badges/`)"
      - "traefik.http.routers.docker-cd-badges.entrypoints=websecure"
      - "traefik.http.services.docker-cd.loadbalancer.server.port=80"
      - "traefik.http.routers.docker-cd-badges.priority=100"
      - "traefik.http.routers.docker-cd.rule=Host(`cd.jaw.dev`)"
      - "traefik.http.routers.docker-cd.entrypoints=websecure"
      - "traefik.http.services.docker-cd.loadbalancer.server.port=80"
      - "traefik.http.routers.docker-cd.middlewares=oauth2-admin@file"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - traefik
    restart: unless-stopped
    # docker-cd already starts with tini. Compose init adds a second init
    # and logs a harmless startup warning.
    # init: true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    oom_score_adj: -500
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  traefik:
    external: true
